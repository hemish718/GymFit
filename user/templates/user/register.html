<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFit - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: #111;
            border-radius: 24px;
            border-left: 6px solid #f5b81b;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: fadeUp 0.6s ease;
        }

        .register-container h1 {
            color: #f5b81b;
            font-size: 32px;
            margin-bottom: 10px;
            text-align: center;
        }

        .register-container p {
            color: #aaa;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f5b81b;
        }

        .form-group input::placeholder {
            color: #555;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: #f5b81b;
            border: none;
            border-radius: 40px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .register-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(245,184,27,0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 14px;
        }

        .login-link a {
            color: #f5b81b;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .messages {
            margin-bottom: 20px;
        }

        .error {
            background: rgba(255,68,68,0.2);
            border: 1px solid #ff4444;
            color: #ff8888;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }

        .success {
            background: rgba(0,255,0,0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }

        .password-hint {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 550px) {
            .register-container {
                padding: 25px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>🏋️ GymFit</h1>
        <p>Create your account to get started</p>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Phone Number (Optional)</label>
                <input type="tel" name="phone" placeholder="10-digit mobile number">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" name="password" placeholder="Create password" required>
                    <div class="password-hint">Minimum 4 characters</div>
                </div>

                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" name="confirm_password" placeholder="Confirm password" required>
                </div>
            </div>

            <button type="submit" class="register-btn"><i class="fas fa-user-plus"></i> Create Account</button>

            <div class="login-link">
                Already have an account? <a href="/user/login/">Login here</a>
            </div>
        </form>
    </div>
</body>
</html>
