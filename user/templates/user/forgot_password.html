<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFit - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .forgot-container {
            background: #111;
            border-radius: 24px;
            border-left: 6px solid #f5b81b;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            animation: fadeUp 0.6s ease;
        }

        .forgot-container h1 {
            color: #f5b81b;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }

        .forgot-container p {
            color: #aaa;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f5b81b;
        }

        .reset-btn {
            width: 100%;
            padding: 14px;
            background: #f5b81b;
            border: none;
            border-radius: 40px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .reset-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(245,184,27,0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 14px;
        }

        .back-link a {
            color: #f5b81b;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .messages {
            margin-bottom: 20px;
        }

        .error {
            background: rgba(255,68,68,0.2);
            border: 1px solid #ff4444;
            color: #ff8888;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }

        .success {
            background: rgba(0,255,0,0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <h1>🔐 Forgot Password?</h1>
        <p>Enter your email address and we'll help you reset your password.</p>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" name="email" placeholder="Enter your registered email" required>
            </div>

            <button type="submit" class="reset-btn">Send Reset Link</button>

            <div class="back-link">
                <a href="/user/login/">← Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
