{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GymFit Login</title>

<!-- GSAP CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
    /* =========================
       GYMFIT LOGIN PAGE STYLES
       ========================= */
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
    }

    .container {
        display: flex;
        height: 100vh;
    }

    /* LEFT ANIMATION SIDE */
    .left {
        width: 50%;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
    }

    .left h1 {
        color: #FFD700;
        font-size: 50px;
        z-index: 2;
        margin-bottom: 10px;
    }

    .left p {
        color: #aaa;
        z-index: 2;
        margin-top: 0;
    }

    /* DUMBBELL */
    .dumbbell {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        top: 35%;
    }

    .plate {
        width: 60px;
        height: 120px;
        background: linear-gradient(145deg, #FFD700, #b8860b);
        border-radius: 10px;
        box-shadow: 0 0 20px #FFD700;
    }

    .rod {
        width: 60px;
        height: 10px;
        background: #333;
    }

    .handle {
        width: 80px;
        height: 20px;
        background: #111;
        border: 2px solid #FFD700;
        border-radius: 5px;
    }

    .left-plate {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
    }

    .right-plate {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
    }

    /* RIGHT LOGIN SIDE */
    .right {
        width: 50%;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-box {
        background: #000;
        padding: 40px;
        border: 2px solid #FFD700;
        border-radius: 10px;
        width: 320px;
    }

    .login-box h2 {
        color: #FFD700;
        text-align: center;
        margin-bottom: 20px;
    }

    .login-box input {
        width: 100%;
        margin: 10px 0;
        padding: 12px;
        background: #111;
        border: 1px solid #333;
        color: #fff;
        border-radius: 5px;
        box-sizing: border-box;
    }

    .login-box input:focus {
        outline: none;
        border-color: #FFD700;
    }

    .login-box button {
        width: 100%;
        padding: 12px;
        background: #FFD700;
        border: none;
        cursor: pointer;
        font-weight: bold;
        border-radius: 5px;
        margin-top: 10px;
        transition: 0.3s;
    }

    .login-box button:hover {
        transform: scale(1.02);
        box-shadow: 0 0 15px rgba(255,215,0,0.5);
    }

    /* 🔥 FORGOT PASSWORD LINK */
    .forgot-link {
        text-align: right;
        margin-top: 8px;
        margin-bottom: 15px;
    }

    .forgot-link a {
        color: #FFD700;
        font-size: 12px;
        text-decoration: none;
        opacity: 0.8;
        transition: 0.3s;
    }

    .forgot-link a:hover {
        opacity: 1;
        text-decoration: underline;
    }

    /* REGISTER LINK */
    .register-link {
        text-align: center;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }

    .register-link p {
        color: #aaa;
        font-size: 14px;
        margin: 0;
    }

    .register-link a {
        color: #FFD700;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
    }

    .register-link a:hover {
        text-decoration: underline;
        color: #ffed4a;
    }

    /* Messages */
    .messages {
        margin-bottom: 15px;
    }

    .error-msg {
        background: rgba(255,68,68,0.2);
        border: 1px solid #ff4444;
        color: #ff8888;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        text-align: center;
        margin-bottom: 10px;
    }

    .success-msg {
        background: rgba(0,255,0,0.2);
        border: 1px solid #00ff00;
        color: #00ff00;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        text-align: center;
        margin-bottom: 10px;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .container {
            flex-direction: column;
        }
        .left, .right {
            width: 100%;
            height: 50vh;
        }
        .dumbbell {
            transform: scale(0.7);
            top: 20%;
        }
        .login-box {
            width: 280px;
            padding: 30px;
        }
    }
</style>

</head>
<body>

<div class="container">

    <!-- LEFT ANIMATION SIDE -->
    <div class="left">
        <div class="dumbbell" id="dumbbell">
            <div class="plate left-plate"></div>
            <div class="rod"></div>
            <div class="handle"></div>
            <div class="rod"></div>
            <div class="plate right-plate"></div>
        </div>
        <h1>GymFit</h1>
        <p>Train Hard. Stay Fit.</p>
    </div>

    <!-- RIGHT LOGIN SIDE -->
    <div class="right">
        <div class="login-box">
            <h2>Login</h2>

            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="{% if message.tags == 'error' %}error-msg{% elif message.tags == 'success' %}success-msg{% else %}error-msg{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <input type="text" placeholder="Email or Name" name="username" required>
                <input type="password" placeholder="Password" name="password" required>

                <!-- 🔥 FORGOT PASSWORD LINK -->
                <div class="forgot-link">
                    <a href="/user/forgot-password/">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>
            </form>

            <!-- REGISTER LINK -->
            <div class="register-link">
                <p>Don't have an account? <a href="/user/register/">Register Now</a></p>
            </div>

        </div>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (typeof gsap !== 'undefined') {
            gsap.to("#dumbbell", {
                y: -25,
                duration: 1.8,
                repeat: -1,
                yoyo: true,
                ease: "power1.inOut"
            });

            gsap.to("#dumbbell", {
                rotation: 12,
                duration: 2.5,
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut",
                transformOrigin: "center center"
            });

            gsap.from(".login-box", {
                x: 150,
                opacity: 0,
                duration: 1,
                ease: "power3.out"
            });

            gsap.from(".left h1", {
                y: -30,
                opacity: 0,
                duration: 1,
                delay: 0.3
            });

            gsap.from(".left p", {
                y: 20,
                opacity: 0,
                duration: 1,
                delay: 0.5
            });

            gsap.from(".register-link", {
                opacity: 0,
                y: 20,
                duration: 0.8,
                delay: 0.7
            });

            const loginBtn = document.querySelector('.login-box button');
            if (loginBtn) {
                loginBtn.addEventListener('mouseenter', () => {
                    gsap.to(loginBtn, { scale: 1.02, duration: 0.2 });
                });
                loginBtn.addEventListener('mouseleave', () => {
                    gsap.to(loginBtn, { scale: 1, duration: 0.2 });
                });
            }

            const inputs = document.querySelectorAll('.login-box input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    gsap.to(input, { borderColor: '#FFD700', boxShadow: '0 0 8px rgba(255,215,0,0.3)', duration: 0.2 });
                });
                input.addEventListener('blur', () => {
                    gsap.to(input, { borderColor: '#333', boxShadow: '0 0 0px', duration: 0.2 });
                });
            });
        }
    });
</script>

</body>
</html>
